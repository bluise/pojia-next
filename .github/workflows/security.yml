name: security

# 安全扫描：每次推送 / PR 自动跑。README 上挂的徽章就是这个 workflow 的状态。
#   · bandit   —— Python 安全静态扫描（**HIGH / MEDIUM 必须为 0**，否则 job 失败）
#   · semgrep  —— 通用安全规则集（ERROR / WARNING 必须为 0）
#   · 自查清单 —— 关键敏感调用逐项断言：核心脚本全 0；GUI 单独口径
#                 （GUI 的环境补全页允许 urllib.request，见该 job 内注释）
#
# v8.5 起扫描两个文件：
#   · 破甲一键通.py  —— 核心（补丁/备份/还原引擎，带封条）
#   · 破甲GUI.py     —— 图形界面（调用核心，无封条；含环境补全下载器）
# v8.8 变更：GUI 的云握手（_cloud_fetch 云验证 / _notice_worker 公告云控 /
# _update_* 在线更新 / _ad_fetch 云端广告）已全部移除 —— exe 不再联网取核心、
# 不再弹任何启动浮层，改为把核心脚本 破甲一键通.py 随包打包、启动时本地加载。
# 相应地：网络白名单从六个收敛为一个（只剩 _env_download 环境补全下载器），
# shell=True 断言从 1 改为 0，__import__ 断言从 1 改为 0。
#
# 用到的配置：仓库根目录的 .bandit.yml（逐条写明哪些告警是已知且可接受的）

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check bandit
      - name: 完整报告（含 LOW，便于人工审计）
        run: bandit -c .bandit.yml -r 破甲一键通.py 破甲GUI.py -f txt || true
      - name: 门禁：HIGH / MEDIUM 必须为 0
        run: |
          bandit -c .bandit.yml -r 破甲一键通.py 破甲GUI.py -f json -o bandit-report.json --exit-zero
          python -c "import json,sys; d=json.load(open('bandit-report.json',encoding='utf-8')); hi=[r for r in d.get('results',[]) if r['issue_severity'] in ('HIGH','MEDIUM')]; print('HIGH/MEDIUM:',len(hi)); [print('  line %s [%s/%s] %s' % (r['line_number'], r['test_id'], r['issue_severity'], r['issue_text'])) for r in hi]; sys.exit(1 if hi else 0)"

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check semgrep
      - name: 门禁：ERROR / WARNING 必须为 0
        run: |
          # 排除项逐条写明理由，而不是把整条规则关掉不看：
          #   1) insecure-hash-sha1 —— 本项目的 sha1 只用于"人格版本标记 / 快照目录名 /
          #      补丁戳（file_sha16）"，非密码学用途，且各处显式标注 usedforsecurity=False。
          #   2) dynamic-urllib-use-detected —— GUI 的 urllib.request 只剩一个白名单函数：
          #      _env_download(url, ...)（环境补全下载器，URL 均为脚本内字面量的 Python
          #      官方 / 镜像源）—— v8.8：云握手（_cloud_fetch 云验证、_notice_worker
          #      公告云控、_update_check / _update_inline_work 在线更新、_ad_fetch
          #      云端广告）已全部移除，白名单从六个收敛为一个。
          #      非用户可控输入；call-audit job 已用 AST 断言把 urllib.request 的全部
          #      出现限定在这一个函数体内（import 恰好 1 处），两个 job 互为佐证。
          EXCLUDE="--exclude-rule python.lang.security.insecure-hash-algorithms.insecure-hash-algorithm-sha1"
          EXCLUDE="$EXCLUDE --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected"
          #   3) exec-detected —— 核心加载的 exec(compile(...)) 在
          #      _core_module_from 体内（v8.8 起为本地随包核心文件，带封条自检；
          #      非用户输入）；call-audit job 已用 AST 断言把它锁定为「恰好
          #      1 处且在该函数体内」，比 exec 的粗粒度审计告警更精准，此处放行。
          EXCLUDE="$EXCLUDE --exclude-rule python.lang.security.audit.exec-detected.exec-detected"
          #   4) subprocess-shell-true —— v8.8 起 GUI 已无 shell=True（原 _notice_worker
          #      云控通道随公告一起移除），全 0，无需放行；此处保留注释说明口径。
          semgrep --config p/python --config p/security-audit \
                  --severity ERROR --severity WARNING --error --metrics=off \
                  $EXCLUDE --json -o semgrep.json 破甲一键通.py 破甲GUI.py || true
          python -c "import json,sys; d=json.load(open('semgrep.json',encoding='utf-8')); bad=[r for r in d.get('results',[]) if (r.get('extra',{}).get('severity') or '').upper() in ('ERROR','WARNING')]; print('ERROR/WARNING:',len(bad)); [print('  %s %s:%s' % (r['check_id'], r['path'], r['start']['line'])) for r in bad[:40]]; sys.exit(1 if bad else 0)"

  call-audit:
    name: call-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 敏感调用逐项断言（核心全 0 · GUI 单独口径）
        run: |
          python -c "
          import re, sys

          def count(path, pats):
              src = open(path, encoding='utf-8').read()
              return {name: len(re.findall(p, src)) for name, p in pats.items()}

          # ── 核心脚本：零网络、零动态执行、零 shell ──────────────────────
          CORE = '破甲一键通.py'
          core_pats = {
              'import requests': r'(?m)^\s*import\s+requests|from\s+requests\s+import',
              'import socket': r'(?m)^\s*import\s+socket|from\s+socket\s+import',
              'eval(': r'\beval\s*\(',
              'exec(': r'\bexec\s*\(',
              'os.system(': r'os\.system\s*\(',
              'shell=True': r'shell\s*=\s*True',
              'urllib.request': r'urllib\.request',
              'http.client': r'http\.client',
              'pickle/marshal': r'\bpickle\.|\bmarshal\.',
              '__import__(': r'__import__\s*\(',
              'subprocess 拼串命令': r'subprocess\.run\([^\[\n]*%|subprocess\.run\([^\[\n]*\.format\(',
          }
          bad = [n for n, c in count(CORE, core_pats).items() if c]
          for n, c in count(CORE, core_pats).items():
              print('  core %-18s %d' % (n, c))
          if bad:
              print('核心出现不该有的调用:', bad); sys.exit(1)

          # ── GUI：零网络例外 = 环境补全下载器 + 本地端口探测 ──────────────
          # 例外 1：urllib.request 只允许出现在一个白名单函数体内（URL 全部由
          #         脚本内字面量拼出）：_env_download（用户主动下载 Python
          #         官方 / 镜像源）——import 必须恰好 1 处，且每一处引用都落在
          #         该函数体内；函数体内「import + urlopen 调用」多处字符串属
          #         正常写法，不能用「全文恰好 N 处」粗计数一刀切；
          #         v8.8：云握手（云验证 / 公告云控 / 在线更新 / 云端广告）与
          #         启动浮层已全部移除，白名单从五个收敛为一个。
          # 例外 2：socket 只允许出现在 _port_busy（本地端口占用探测，防
          #         SO_REUSEADDR 假成功）—— 所有 connect 目标必须全是 127.0.0.1。
          # 例外 3：exec 恰好 1 处且在 _core_module_from 体内（本地随包核心
          #         文件加载，带封条自检）；__import__ 全 0。
          # 其余敏感调用（含 shell=True）与核心同口径全 0 —— v8.8 移除
          # _notice_worker 后，GUI 已彻底没有 shell=True。
          GUI = '破甲GUI.py'
          gui_pats = {
              'import requests': r'(?m)^\s*import\s+requests|from\s+requests\s+import',
              'eval(': r'\beval\s*\(',
              'os.system(': r'os\.system\s*\(',
              'shell=True': r'shell\s*=\s*True',
              'http.client': r'http\.client',
              'pickle/marshal': r'\bpickle\.|\bmarshal\.',
              'subprocess 拼串命令': r'subprocess\.run\([^\[\n]*%|subprocess\.run\([^\[\n]*\.format\(',
          }
          gsrc = open(GUI, encoding='utf-8').read()
          bad = [n for n, c in count(GUI, gui_pats).items() if c]
          for n, c in count(GUI, gui_pats).items():
              print('  gui  %-18s %d' % (n, c))
          if bad:
              print('GUI 出现不该有的调用:', bad); sys.exit(1)

          import ast
          tree = ast.parse(gsrc)
          want_fns = ('_env_download',)
          fns = [n for n in tree.body
                 if isinstance(n, ast.FunctionDef) and n.name in want_fns]
          missing = [w for w in want_fns if w not in [f.name for f in fns]]
          if missing:
              print('GUI 里找不到网络白名单函数: %s' % missing); sys.exit(1)
          occ = [gsrc.count(chr(10), 0, m.start()) + 1
                 for m in re.finditer(r'urllib\.request', gsrc)]
          n_imp = len(re.findall(r'(?m)^\s*import\s+urllib\.request\b', gsrc))
          bad_ln = [ln for ln in occ
                    if not any(f.lineno <= ln <= f.end_lineno for f in fns)]
          rng = ' + '.join('%s[%d~%d]' % (f.name, f.lineno, f.end_lineno) for f in fns)
          print('  gui  urllib.request     %d 处（import %d，白名单 %s，全在体内则合规）' % (len(occ), n_imp, rng))
          if n_imp != len(fns) or bad_ln:
              print('GUI 的 urllib.request 违规：import=%d（应 %d），越出行号=%s' % (n_imp, len(fns), bad_ln)); sys.exit(1)

          n_conn = len(re.findall(r'\.connect\(', gsrc))
          # 注意：这段脚本跑在 bash 的 python -c "..." 双引号里，裸双引号会被 bash
          # 剥掉、正则被静默改写 —— 所以这里用 \x22 表示双引号字符（re 层等价）。
          n_local = len(re.findall(r'\.connect\(\(\x22127\.0\.0\.1\x22', gsrc))
          print('  gui  socket connect     %d/%d 指向 127.0.0.1（全为本地回环则合规）' % (n_local, n_conn))
          if n_conn != n_local:
              print('GUI 的 socket connect 存在非 127.0.0.1 目标！'); sys.exit(1)

          # 例外 3 断言：exec 恰好 1 处且在 _core_module_from 体内（本地随包核心加载）；
          # __import__ 全 0（v8.8 移除 _cloud_hwid 后不再有任何动态导入）。
          fn_cmod = next((n for n in tree.body
                          if isinstance(n, ast.FunctionDef) and n.name == '_core_module_from'), None)
          if fn_cmod is None:
              print('GUI 里找不到 exec 白名单函数（_core_module_from）'); sys.exit(1)
          occ_exec = [gsrc.count(chr(10), 0, m.start()) + 1
                      for m in re.finditer(r'\bexec\s*\(', gsrc)]
          occ_impo = [gsrc.count(chr(10), 0, m.start()) + 1
                      for m in re.finditer(r'__import__\s*\(', gsrc)]
          ok_exec = len(occ_exec) == 1 and fn_cmod.lineno <= occ_exec[0] <= fn_cmod.end_lineno
          ok_impo = len(occ_impo) == 0
          print('  gui  exec               %d 处（_core_module_from 核心加载，恰好 1 处则合规）' % len(occ_exec))
          print('  gui  __import__         %d 处（应为 0，无动态导入则合规）' % len(occ_impo))
          if not (ok_exec and ok_impo):
              print('GUI 的 exec/__import__ 违规：exec=%s __import__=%s' % (occ_exec, occ_impo)); sys.exit(1)
          print('全部合规')
          "
